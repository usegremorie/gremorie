name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: lint • test • build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Nx SHAs for affected
        uses: nrwl/nx-set-shas@v5

      - name: Install dependencies
        # `--legacy-peer-deps` mirrors local installs: @storybook/angular pins an
        # older @angular-devkit/architect than the Angular 21 toolchain resolves,
        # a known peer-range conflict across the Angular/Storybook stack.
        run: npm ci --legacy-peer-deps

      - name: Generate Fumadocs source
        # apps/docs/.source is generated by fumadocs-mdx and gitignored. The
        # docs `postinstall` produces it, but npm ci doesn't reliably run a
        # workspace's lifecycle script — without `.source`, every `@/.source`
        # import resolves to an unresolved (`error`) type and type-aware lint
        # cascades no-unsafe-* failures across the whole docs project.
        run: npm run postinstall --workspace=apps/docs

      - name: Format check
        run: npx nx format:check

      - name: Lint affected
        run: npx nx affected -t lint --parallel=3

      - name: Build affected
        env:
          NX_IGNORE_UNSUPPORTED_TS_SETUP: 'true'
        run: npx nx affected -t build --parallel=3

      - name: Registry matches its sources
        # apps/docs/public/r is generated from the packages (registry:generate)
        # and committed. Deploys regenerate it, so a stale copy never ships,
        # but the repo copy drifted once (#176 changed ng-forms without the
        # regenerated JSON). Regenerate unconditionally and fail on any diff,
        # including new files the generator would add.
        run: |
          npx nx run registry:generate --skip-nx-cache
          if [ -n "$(git status --porcelain -- apps/docs/public/r)" ]; then
            git status --short -- apps/docs/public/r
            echo "::error::apps/docs/public/r is out of date. Run 'npx nx run registry:generate' and commit the result."
            exit 1
          fi

      - name: Test affected
        env:
          NX_IGNORE_UNSUPPORTED_TS_SETUP: 'true'
        run: npx nx affected -t test --parallel=3

      - name: Verify platform outputs affected (Kotlin compile, Swift typecheck)
        # ubuntu-latest ships kotlinc and swiftc; the target builds the tokens
        # first and fails here, unlike locally, when a compiler is missing.
        # The versions are logged first; a missing compiler only fails the
        # target, so a run that does not touch the tokens still passes.
        env:
          NX_IGNORE_UNSUPPORTED_TS_SETUP: 'true'
          REQUIRE_PLATFORM_COMPILERS: '1'
        run: |
          kotlinc -version || echo 'kotlinc not found'
          swiftc --version || echo 'swiftc not found'
          npx nx affected -t verify-platforms --parallel=1
