name: Chromatic

# Publishes BOTH Storybooks to Chromatic (which hosts them publicly AND runs
# visual regression tests). The workbench app embeds the published Storybooks
# via VITE_RX_BASE / VITE_NG_BASE (set in the Vercel project to the Chromatic
# branch permalinks). The workbench app itself deploys via Vercel's Git
# integration, not this workflow.
#
# Required repo secrets:
#   CHROMATIC_RX_TOKEN  - project token for the React Storybook project
#   CHROMATIC_NG_TOKEN  - project token for the Angular Storybook project

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. This workflow only reads the repo and talks to Chromatic;
# it never writes back. A compromised step therefore cannot push, comment, or
# mint tokens.
permissions:
  contents: read

jobs:
  rx-storybook:
    name: React Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Chromatic needs full git history for baselines
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx nx build-storybook rx-ai
      # Pinned to a commit SHA, not a floating tag: this third-party action
      # receives CHROMATIC_RX_TOKEN, so a hijacked tag would exfiltrate it.
      # Dependabot (github-actions ecosystem) bumps the SHA on new releases.
      - uses: chromaui/action@bb3b582719a93c1828c5e520e62992b2937d7889 # v18.9.4
        with:
          projectToken: ${{ secrets.CHROMATIC_RX_TOKEN }}
          storybookBuildDir: dist/storybook/rx-ai
          onlyChanged: true # TurboSnap: only snapshot changed stories (saves quota)
          exitZeroOnChanges: true # report visual diffs, don't fail the build
          # Whatever lands on the trunk IS the reference. Without this, a diff
          # on a PR never becomes a baseline, so the next PR inherits it and the
          # backlog compounds - it reached 83 unreviewed changes before anyone
          # looked. Accepting on main keeps each PR's report to what that PR did.
          autoAcceptChanges: main

  ng-storybook:
    name: Angular Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx nx build-storybook ng-ai
      - uses: chromaui/action@bb3b582719a93c1828c5e520e62992b2937d7889 # v18.9.4
        with:
          projectToken: ${{ secrets.CHROMATIC_NG_TOKEN }}
          storybookBuildDir: dist/storybook/ng-ai
          onlyChanged: true
          exitZeroOnChanges: true
          autoAcceptChanges: main
